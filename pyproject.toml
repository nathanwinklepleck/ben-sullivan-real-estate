[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cre-underwriting"
version = "0.1.0"
description = "Commercial real estate underwriting calculation engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
  "numpy>=2.1",
  "numpy-financial>=1.0",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "pydantic>=2.9",
  "uvicorn>=0.30",
  "weasyprint>=63",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
